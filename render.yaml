# Render Blueprint for the AgroLink backend. See DEPLOYMENT.md for the full walkthrough and every variable.
# Values marked `sync: false` are asked for in the Render dashboard the first time the Blueprint is created.
services:
  - type: web
    name: agrolink-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    autoDeployTrigger: commit
    envVars:
      # Database (MongoDB Atlas connection string, including the /agrolink database name)
      - key: MONGODB_URI
        sync: false

      # Auth: Render generates a random 256-bit secret once and keeps it across deploys
      - key: JWT_SECRET
        generateValue: true

      # Exact URL of the Vercel frontend, no trailing slash. Comma-separate several.
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # First admin account, created on startup if it does not exist yet
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false

      # Razorpay (test keys while testing)
      - key: RAZORPAY_KEY
        sync: false
      - key: RAZORPAY_SECRET
        sync: false

      # Never enable on a public deployment: it lets anyone log in as any role without a password.
      - key: DEMO_LOGIN_ENABLED
        value: "false"
