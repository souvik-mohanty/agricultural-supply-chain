spring:
  application:
    name: agrolink

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/agrolink}
      auto-index-creation: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: false

jwt:
  # Must be at least 32 bytes. The default is for local development only - always set JWT_SECRET in production.
  secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789}
  expiration-ms: 86400000

razorpay:
  key: ${RAZORPAY_KEY:}
  secret: ${RAZORPAY_SECRET:}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  # Demo mode: dummy accounts with PUBLIC passwords, listed on the login page so visitors can look around without
  # registering. Off by default. include-staff=false leaves out the ADMIN and MANAGER accounts (use that for a public
  # showcase); with it on (local development) there is a public admin password, so never do that with real data.
  demo-login:
    enabled: ${DEMO_LOGIN_ENABLED:false}
    include-staff: ${DEMO_INCLUDE_STAFF:true}

  # Optional: creates this ADMIN account on startup when it does not exist yet.
  admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
    email: ${ADMIN_EMAIL:}

  orders:
    # Unpaid orders release their reserved stock after this many minutes.
    pending-expiry-minutes: 30
    expiry-check-ms: 300000

  # Toggle with the `maintenance` profile (see application-maintenance.yml) or these properties.
  maintenance:
    enabled: false
    blocked-paths: []
    blocked-origin:
